<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>팬텀 포스 공통 파츠 도감</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E4E8DF; --surface:#F4F6F0; --surface2:#EAEDE5; --ink:#1D2620; --muted:#5A675D; --line:#C6CDC0;
  --brass:#946620; --good:#16704F; --bad:#AE3626; --vis:#6B7882; --focus:#2C5F8E; --chip:#DDE2D6;
  --good-bg:rgba(22,112,79,.10); --bad-bg:rgba(174,54,38,.10); --brass-bg:rgba(148,102,32,.12);
  --display:"Black Han Sans","IBM Plex Sans KR",system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR",system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141814; --surface:#1C211C; --surface2:#232923; --ink:#E3E8DF; --muted:#9AA59B; --line:#343C33;
    --brass:#D6A55A; --good:#4CC393; --bad:#F27C68; --vis:#95A3AC; --focus:#86B5E2; --chip:#2A312A;
    --good-bg:rgba(76,195,147,.13); --bad-bg:rgba(242,124,104,.13); --brass-bg:rgba(214,165,90,.14);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141814; --surface:#1C211C; --surface2:#232923; --ink:#E3E8DF; --muted:#9AA59B; --line:#343C33;
  --brass:#D6A55A; --good:#4CC393; --bad:#F27C68; --vis:#95A3AC; --focus:#86B5E2; --chip:#2A312A;
  --good-bg:rgba(76,195,147,.13); --bad-bg:rgba(242,124,104,.13); --brass-bg:rgba(214,165,90,.14);
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
.num{font-variant-numeric:tabular-nums}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}

/* 머리 */
header.top{padding:28px 0 18px}
.brand{display:flex;gap:16px;align-items:center}
.brand svg{flex:none}
h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,6vw,44px);line-height:1.05;margin:0;letter-spacing:-.01em}
.lede{margin:8px 0 0;color:var(--muted);max-width:62ch}
.legend{margin-top:16px;display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px;color:var(--muted);align-items:center}
.legend span{display:inline-flex;gap:6px;align-items:center}
.sw{width:10px;height:10px;border-radius:2px;display:inline-block}

/* 탭 */
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto}
nav.tabs button{background:none;border:0;padding:12px 14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brass)}
main{padding:18px 0 64px}
section[hidden]{display:none}

/* 필터 */
.filters{display:grid;gap:10px;margin-bottom:16px}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.search select{padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);max-width:46%}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13.5px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .c{opacity:.65;margin-left:4px}
.count{font-size:13px;color:var(--muted)}

/* 파츠 목록 */
.list{display:grid;gap:10px}
@media (min-width:780px){.list{grid-template-columns:1fr 1fr}}
.part{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-content:start}
.part .g{grid-row:span 3;align-self:start}
.part h3{margin:0;font-size:16.5px;line-height:1.3;font-weight:700}
.meta{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
.badge{font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:5px;background:var(--brass-bg);color:var(--brass)}
.badge.unk{background:var(--bad-bg);color:var(--bad)}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tag{font-size:12.5px;padding:3px 8px;border-radius:6px;background:var(--surface2);border:1px solid var(--line);white-space:nowrap}
.tag.good{background:var(--good-bg);border-color:transparent;color:var(--good)}
.tag.bad{background:var(--bad-bg);border-color:transparent;color:var(--bad)}
.tag.flip{background:var(--brass-bg);border-color:transparent;color:var(--brass)}
.tag.l2{border-style:dashed}
.tag b{font-weight:700}
.more{grid-column:1/-1;margin-top:6px}
.more>button{background:none;border:0;padding:4px 0;color:var(--brass);font-weight:600;cursor:pointer}
.detail{grid-column:1/-1;margin-top:8px;border-top:1px solid var(--line);padding-top:10px}
.note{font-size:13px;background:var(--surface2);border-left:3px solid var(--brass);padding:8px 10px;border-radius:0 8px 8px 0;margin:0 0 10px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--muted);white-space:nowrap}
td.v{white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:600}
td.good{color:var(--good)} td.bad{color:var(--bad)} td.flip{color:var(--brass)}
tr.vis td{color:var(--vis)} tr.vis td.v{font-weight:500}
.cond{color:var(--muted);font-size:12px}
h4{margin:12px 0 4px;font-size:13.5px}
.empty{padding:28px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px}

/* 계산기 */
.calc{display:grid;gap:16px}
@media (min-width:920px){.calc{grid-template-columns:330px 1fr;align-items:start}.slots{position:sticky;top:calc(env(safe-area-inset-top,0px) + 60px)}}
.slots{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px}
.slots label{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
.slots select{padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);font-weight:500;color:var(--ink)}
.slots .row{display:flex;gap:8px;justify-content:space-between;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:9px;padding:8px 12px;cursor:pointer;font-weight:600}
.result{display:grid;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.panel h2{font-family:var(--display);font-weight:400;font-size:20px;margin:0 0 10px;letter-spacing:-.005em}
.hero{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.big{display:grid;gap:8px}
.big .k{font-size:13px;color:var(--muted)}
.big .x{font-family:var(--display);font-size:30px;line-height:1}
.big .x small{font-family:var(--body);font-size:14px;font-weight:600;margin-left:6px}
.good-t{color:var(--good)} .bad-t{color:var(--bad)} .flip-t{color:var(--brass)} .mut-t{color:var(--muted)}
.grid4 td,.grid4 th{text-align:center}
.grid4 td:first-child,.grid4 th:first-child{text-align:left}
.stat{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:8px 0;border-bottom:1px solid var(--line)}
.stat:last-child{border-bottom:0}
.stat .l{font-weight:600}
.stat .v{font-variant-numeric:tabular-nums;font-weight:700;text-align:right}
.stat .s{grid-column:1/-1;font-size:12px;color:var(--muted)}
details.all summary{cursor:pointer;font-weight:700;padding:4px 0}
details.k{border-bottom:1px solid var(--line);padding:6px 0}
details.k summary{cursor:pointer;display:flex;justify-content:space-between;gap:10px}
details.k summary::-webkit-details-marker{display:none}
details.k .f{font-size:12.5px;color:var(--muted);padding:6px 0 2px 10px;border-left:2px solid var(--line);margin-top:6px}
.f code{font-family:var(--body);font-weight:600;color:var(--ink)}

/* 계산 방식 */
.rules{display:grid;gap:14px;max-width:820px}
.rules p,.rules li{max-width:72ch}
.rules ul{padding-left:20px;margin:6px 0}
.formula{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-variant-numeric:tabular-nums}
.optlist{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.optlist span{font-size:12.5px;padding:2px 8px;border-radius:6px;background:var(--surface2);border:1px solid var(--line)}
footer{color:var(--muted);font-size:12.5px;padding:24px 0 40px;border-top:1px solid var(--line)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <span id="heroGlyph" aria-hidden="true"></span>
      <div>
        <h1>팬텀 포스 공통 파츠 도감</h1>
        <p class="lede">모든 총에 달 수 있는 공통 파츠와 자주 쓰는 탄약 두 종의 실제 효과를 게임 계산 방식 그대로 보여줘요. 파츠를 골라 조합하면 최종 반동 배율도 계산돼요.</p>
      </div>
    </div>
    <div class="legend">
      <span>십자선 길이 = 반동 크기 (점선 원이 기본)</span>
      <span><i class="sw" style="background:var(--good)"></i>줄어듦</span>
      <span><i class="sw" style="background:var(--bad)"></i>늘어남</span>
      <span><i class="sw" style="background:var(--brass)"></i>방향 반전</span>
    </div>
  </div>
</header>

<nav class="tabs" aria-label="화면 전환">
  <div class="wrap" role="tablist">
    <button role="tab" id="t-parts" aria-controls="tab-parts" aria-selected="true">파츠 찾기</button>
    <button role="tab" id="t-calc" aria-controls="tab-calc" aria-selected="false">조합 계산</button>
    <button role="tab" id="t-rules" aria-controls="tab-rules" aria-selected="false">계산 방식</button>
  </div>
</nav>

<main class="wrap">
  <section id="tab-parts" role="tabpanel" aria-labelledby="t-parts">
    <div class="filters">
      <div class="search">
        <input id="q" type="search" placeholder="이름으로 찾기 (예: 버티컬, 소음기, 레이저)" aria-label="파츠 이름 검색">
        <select id="sort" aria-label="정렬">
          <option value="kills">해금 킬 적은 순</option>
          <option value="v">수직 반동 감소 큰 순</option>
          <option value="h">좌우 반동 감소 큰 순</option>
          <option value="name">이름 순</option>
        </select>
      </div>
      <div class="chips" id="slotChips" aria-label="슬롯"></div>
      <div class="chips" id="effChips" aria-label="효과 조건"></div>
      <div class="count" id="count" aria-live="polite"></div>
    </div>
    <div class="list" id="list"></div>
  </section>

  <section id="tab-calc" role="tabpanel" aria-labelledby="t-calc" hidden>
    <div class="calc">
      <div class="slots" id="slots"></div>
      <div class="result" id="result"></div>
    </div>
  </section>

  <section id="tab-rules" role="tabpanel" aria-labelledby="t-rules" hidden>
    <div class="rules" id="rules"></div>
  </section>
</main>

<footer>
  <div class="wrap" id="foot"></div>
</footer>

      case 'scope': return '배율 스코프를 달았을 때만 작동';
      case 'hip': return '지향사격에만 적용';
      default: return '';
    }
  }

  // 단독 적용 배율
  function factorOf(op, v) {
    if (op === 'rel') return v >= 0 ? 1 + v : 1 / (1 - v);
    if (op === 'mul') return v;
    return null;
  }

  // 조합 계산: 게임 규칙 그대로 (설정 → 더하기 → 합산 배율 → 곱하기 배율)
  function combine(items) {
    const acc = new Map();
    items.forEach((it, order) => {
      for (const m of it.mods) {
        let a = acc.get(m.key);
        if (!a) { a = { key: m.key, set: null, add: 0, hasAdd: false, P: 0, N: 0, mul: 1, hasMul: false, hasRel: false, parts: [] }; acc.set(m.key, a); }
        a.parts.push({ name: it.name, op: m.op, val: m.val });
        if (m.op === 'set') {
          const pri = m.pri || 0;
          if (!a.set || pri >= a.set.pri) a.set = { val: m.val, pri, from: it.name };
        } else if (m.op === 'add') { a.add += m.val; a.hasAdd = true; }
        else if (m.op === 'rel') { a.hasRel = true; if (m.val > 0) a.P += m.val; else a.N += -m.val; }
        else if (m.op === 'mul') { a.hasMul = true; a.mul *= m.val; }
      }
    });
    const out = new Map();
    for (const [k, a] of acc) {
      const rel = (1 + a.P) / (1 + a.N);
      out.set(k, { ...a, rel, factor: rel * a.mul, d: describe(k) });
    }
    return out;
  }

  function fmtPct(f) {
    const p = (f - 1) * 100;
    const r = Math.abs(p) < 0.05 ? 0 : p;
    const s = Math.abs(r) >= 10 ? Math.round(r) : Math.round(r * 10) / 10;
    return (s > 0 ? '+' : s < 0 ? '−' : '±') + Math.abs(s) + '%';
  }
  function fmtX(f) {
    const a = Math.abs(f);
    return '×' + (a >= 10 ? a.toFixed(1) : a.toFixed(2).replace(/0$/, '').replace(/\.$/, ''));
  }
  // 결과 판정: good / bad / neutral
  function verdict(d, f) {
    if (f === 1 || d.better == null) return 'neutral';
    if (d.recoil && d.prm === 4) f = Math.abs(f);
    if (f < 0) return 'flip';
    const up = f > 1;
    return (d.better === 'high') === up ? 'good' : 'bad';
  }
  // 값 문자열
  function valueText(r) {
    const d = r.d;
    let f = r.factor;
    const isVar = d.recoil && d.prm === 4;
    if (r.set) {
      let s = `= ${fmtVal(r.set.val)}`;
      if (r.hasAdd) s = `= ${fmtVal(r.set.val + r.add)}`;
      if (r.hasRel || r.hasMul) s += ` ${fmtX(f)}`;
      return s;
    }
    let s = '';
    if (r.hasAdd) s += `+${fmtVal(r.add)} `;
    if (r.hasRel || r.hasMul) {
      if (f < 0 && !isVar) s += `방향 반전 ${fmtX(f)}`;
      else { const g = isVar ? Math.abs(f) : f; s += `${fmtPct(g)} (${fmtX(g)})`; }
    }
    return s.trim();
  }
  function fmtVal(v) {
    if (v === true) return '켜짐';
    if (v === false) return '꺼짐';
    if (typeof v === 'number') return Math.round(v * 1000) / 1000;
    return String(v);
  }

  // 직관 지수: 1층 카메라·총 반동 (쏠림·랜덤) 평균
  function recoilIndex(res, axis) {
    const ks = [`recoil.aimCameraBody.${axis}.1.3`, `recoil.aimCameraBody.${axis}.1.4`, `recoil.aimRotation.${axis}.1.3`, `recoil.aimRotation.${axis}.1.4`];
    let sum = 0, flip = false;
    for (const k of ks) {
      const r = res.get(k);
      let f = r ? r.factor : 1;
      if (f < 0) { if (k.endsWith('.3')) flip = true; f = -f; }
      sum += f;
    }
    return { v: sum / ks.length, flip };
  }
  function adsMove(res) {
    const w = res.get('walkspeed'), a = res.get('aimwalkspeedmult');
    const wf = w ? w.factor : 1;
    if (a && a.set) return { fixed: a.set.val * (a.factor || 1), f: wf, text: `조준 이동 배율 ${fmtVal(a.set.val * (a.hasRel || a.hasMul ? a.factor : 1))}로 고정` };
    const af = a ? a.factor : 1;
    return { f: wf * af };
  }

  return { describe, condNote, factorOf, combine, fmtPct, fmtX, verdict, valueText, fmtVal, recoilIndex, adsMove };
})();

  $('#effChips').innerHTML = EFFS.map(([k, n]) => `<button class="chip" data-eff="${k}" aria-pressed="${st.eff.has(k)}">${n}</button>`).join('');
}
function renderList() {
  let L = ITEMS.filter(i => (st.slot === 'all' || i.slots.includes(st.slot)) && [...st.eff].every(e => i.flags[e]) && (!st.q || i.search.includes(st.q)));
  const by = { kills: (a, b) => (a.kills ?? 9e9) - (b.kills ?? 9e9), v: (a, b) => a.vi.v - b.vi.v, h: (a, b) => a.hi.v - b.hi.v, name: (a, b) => a.name.localeCompare(b.name) }[st.sort];

  $('#list').innerHTML = L.map(it => {
    const open = st.open.has(it.id);

    const slots = it.slots.map(s => SLOT_KO[s]).join(' / ');
    return `<article class="part">
      <div class="g">${glyph(it.vi.v, it.hi.v, it.vi.flip)}</div>

      <div class="meta"><span>${slots}</span>${it.kills != null ? `<span class="num">해금 ${it.kills.toLocaleString()}킬</span>` : ''}${it.patch ? `<span class="badge ${it.patch.type === 'unknown' ? 'unk' : ''}">${esc(PATCH_KO[it.patch.type])}</span>` : ''}</div>
      <div class="tags">${tags}</div>
      <div class="more"><button data-open="${esc(it.id)}" aria-expanded="${open}">${open ? '접기' : '정확한 수치 보기'}</button></div>
      ${open ? `<div class="detail">${detailHTML(it)}</div>` : ''}
    </article>`;
  }).join('');
}
$('#slotChips').addEventListener('click', e => { const b = e.target.closest('[data-slot]'); if (!b) return; st.slot = b.dataset.slot; renderChips(); renderList(); });
$('#effChips').addEventListener('click', e => { const b = e.target.closest('[data-eff]'); if (!b) return; const k = b.dataset.eff; st.eff.has(k) ? st.eff.delete(k) : st.eff.add(k); renderChips(); renderList(); });
$('#q').addEventListener('input', e => { st.q = e.target.value.trim().toLowerCase(); renderList(); });
$('#sort').addEventListener('change', e => { st.sort = e.target.value; renderList(); });
$('#list').addEventListener('click', e => { const b = e.target.closest('[data-open]'); if (!b) return; const id = b.dataset.open; st.open.has(id) ? st.open.delete(id) : st.open.add(id); renderList(); });

/* ----- 조합 계산 ----- */
const CS = ['Optics','Barrel','Underbarrel','Other','Ammo'];
const sel = { Optics:'', Barrel:'', Underbarrel:'', Other:'', Ammo:'' };
function renderSlots() {
  let h = '';
  for (const s of CS) {
    const opts = ITEMS.filter(i => i.slots.includes(s)).sort((a, b) => (a.kills ?? 0) - (b.kills ?? 0));
    const other = s === 'Underbarrel' ? sel.Other : s === 'Other' ? sel.Underbarrel : '';
    h += `<label>${SLOT_KO[s]}<select data-s="${s}"><option value="">없음${s === 'Optics' ? ' (또는 성능 변화 없는 조준경)' : ''}</option>${opts.map(o => `<option value="${esc(o.id)}" ${sel[s] === o.id ? 'selected' : ''} ${other === o.id ? 'disabled' : ''}>${esc(o.name)}${o.kills != null ? ` (${o.kills}킬)` : ''}${o.calcOff ? ' — 수치 미공개' : ''}</option>`).join('')}</select></label>`;
  }
  h += `<div class="row"><span class="cond">공통 파츠만 있어요. 탄약은 SAP와 .223 Rem만 있고, 해당 계열 총에서만 쓸 수 있어요.</span><button class="btn" id="clear">모두 비우기</button></div>`;
  $('#slots').innerHTML = h;
}
$('#slots').addEventListener('change', e => { const s = e.target.dataset.s; if (!s) return; sel[s] = e.target.value; renderSlots(); renderResult(); });
$('#slots').addEventListener('click', e => { if (e.target.id === 'clear') { CS.forEach(s => sel[s] = ''); renderSlots(); renderResult(); } });

function cls(v) { return v === 'good' ? 'good-t' : v === 'bad' ? 'bad-t' : v === 'flip' ? 'flip-t' : 'mut-t'; }
function cellFor(res, key) {
  const r = res.get(key); if (!r) return `<td class="mut-t">−</td>`;
  const isVar = r.d.prm === 4; let f = isVar ? Math.abs(r.factor) : r.factor;
  if (f < 0) return `<td class="flip-t" title="${E.fmtX(f)}"><b>반전</b><div class="cond">${E.fmtX(f)}</div></td>`;
  const v = E.verdict(r.d, f);
  return `<td class="${cls(v)}"><b class="num">${E.fmtPct(f)}</b><div class="cond num">${E.fmtX(f)}</div></td>`;
}
function formulaHTML(r) {
  const p = r.parts.map(x => `<div>${esc(x.name)}: ${OPNAME[x.op]} <code>${esc(x.op === 'rel' ? (x.val > 0 ? '+' : '') + x.val : x.op === 'mul' ? '×' + x.val : x.op === 'add' ? '+' + x.val : E.fmtVal(x.val))}</code></div>`).join('');
  const steps = [];
  if (r.set) steps.push(`설정값 <code>${E.fmtVal(r.set.val)}</code> (${esc(r.set.from)})`);
  if (r.hasAdd) steps.push(`더하기 <code>+${E.fmtVal(r.add)}</code>`);
  if (r.hasRel) steps.push(`합산 배율 <code>(1 + ${+r.P.toFixed(4)}) ÷ (1 + ${+r.N.toFixed(4)}) = ${E.fmtX(r.rel)}</code>`);
  if (r.hasMul) steps.push(`곱하기 <code>${E.fmtX(r.mul)}${r.mul < 0 ? ' (음수 = 방향 반전)' : ''}</code>`);
  if ((r.hasRel || r.hasMul) && !r.set) steps.push(`최종 <code>${E.fmtX(r.factor)}${r.factor < 0 ? ' 반전' : ''}</code>`);
  const c = E.condNote(r.d);
  return `<div class="f">${p}<div style="margin-top:4px">${steps.join('<br>')}</div>${c ? `<div style="margin-top:4px">${esc(c)}</div>` : ''}</div>`;
}
function statRow(res, key, label, sub) {
  const r = res.get(key); if (!r) return '';
  const v = E.verdict(r.d, r.d.prm === 4 ? Math.abs(r.factor) : r.factor);
  return `<div class="stat"><span class="l">${esc(label || r.d.label)}</span><span class="v ${r.set ? '' : cls(v)}">${esc(E.valueText(r))}</span>${sub ? `<span class="s">${esc(sub)}</span>` : ''}</div>`;
}
function renderResult() {
  const chosen = CS.map(s => ITEMS.find(i => i.id === sel[s])).filter(Boolean);
  const usable = chosen.filter(i => !i.calcOff);
  const res = E.combine(usable);
  const vi = E.recoilIndex(res, 'x'), hi = E.recoilIndex(res, 'y'), ads = E.adsMove(res);
  const vv = vi.flip ? 'flip' : vi.v < 0.995 ? 'good' : vi.v > 1.005 ? 'bad' : '';
  const hv = hi.v < 0.995 ? 'good' : hi.v > 1.005 ? 'bad' : '';
  let h = `<div class="panel"><div class="hero">${glyph(vi.v, hi.v, vi.flip, 96)}<div class="big">
    <div><div class="k">수직 반동 (카메라·총, 쏠림·랜덤 평균)</div><div class="x ${cls(vv)} num">${E.fmtX(vi.v)}<small>${vi.flip ? '방향 반전 포함' : E.fmtPct(vi.v)}</small></div></div>
    <div><div class="k">좌우 반동 (카메라·총, 쏠림·랜덤 평균)</div><div class="x ${cls(hv)} num">${E.fmtX(hi.v)}<small>${E.fmtPct(hi.v)}</small></div></div>
  </div></div>${chosen.some(i => i.calcOff) ? `<p class="note" style="margin-top:12px">수치가 공개되지 않은 파츠(${chosen.filter(i => i.calcOff).map(i => esc(i.name)).join(', ')})는 계산에서 빠졌어요.</p>` : ''}
  ${!chosen.length ? `<p class="cond" style="margin-top:10px">왼쪽에서 슬롯별로 파츠를 골라보세요. 총의 기본 반동에 아래 배율이 곱해져요.</p>` : ''}</div>`;

  h += `<div class="panel"><h2>탄착에 영향 주는 반동</h2><div class="scroll"><table class="grid4"><thead><tr><th></th><th>쏠림</th><th>랜덤</th><th>2층 쏠림</th><th>2층 랜덤</th></tr></thead><tbody>`;
  for (const [g, gn] of RG) for (const ax of ['x','y']) {
    h += `<tr><td><b>${gn} ${ax === 'x' ? '수직' : '좌우'}</b></td>${[`recoil.${g}.${ax}.1.3`,`recoil.${g}.${ax}.1.4`,`recoil.${g}.${ax}.2.3`,`recoil.${g}.${ax}.2.4`].map(k => cellFor(res, k)).join('')}</tr>`;
  }
  h += `</tbody></table></div><p class="cond" style="margin:8px 0 0">쏠림은 매 발 같은 방향으로 미는 힘(손으로 잡는 부분), 랜덤은 매 발 무작위로 흔들리는 양(손으로 못 잡는 부분)이에요. 2층은 반동이 2단으로 된 총에서만 작동해요.</p></div>`;

  let adsTxt = '', adsCls = '';
  if (ads.fixed) { adsTxt = `배율 ${E.fmtVal(ads.fixed)} 고정${Math.abs(ads.f - 1) > 0.004 ? `, 기본 이동 ${E.fmtPct(ads.f)}` : ''}`; adsCls = 'bad-t'; }
  else if (Math.abs(ads.f - 1) > 0.0005) { adsTxt = `${E.fmtPct(ads.f)} (${E.fmtX(ads.f)})`; adsCls = ads.f > 1 ? 'good-t' : 'bad-t'; }
  h += `<div class="panel"><h2>조작과 흔들림</h2>
    ${adsTxt ? `<div class="stat"><span class="l">조준 중 이동 속도</span><span class="v ${adsCls}">${esc(adsTxt)}</span><span class="s">기본 이동 속도와 조준 중 이동 배율을 합친 값</span></div>` : ''}
    ${statRow(res,'aimspeed','조준 속도')}${statRow(res,'magnifyspeed','배율 전환 속도')}${statRow(res,'sprintspeed','달리다 쏘기 전환')}${statRow(res,'equipspeed','꺼내기 속도')}
    ${statRow(res,'walkswayrotaimmult','조준 중 걷기 흔들림','탄착에 영향을 주는 회전 흔들림')}${statRow(res,'sway.posImpToAngImpMult','이동 방향 바꿀 때 총 튐')}${statRow(res,'sway.angImpToAngImpMult','마우스 휙 돌릴 때 총 튐')}
    ${statRow(res,'aimswingmod','시점 돌릴 때 총 흔들림','이 수치가 있는 총 16종에서만 작동')}${statRow(res,'swayamp','스코프 흔들림 크기','배율 스코프를 달았을 때만')}
    ${!['aimspeed','magnifyspeed','sprintspeed','equipspeed','walkswayrotaimmult','sway.posImpToAngImpMult','sway.angImpToAngImpMult','aimswingmod','swayamp'].some(k => res.has(k)) && !adsTxt ? '<p class="cond">변화 없음</p>' : ''}</div>`;

  const bal = ['bulletspeed','firerate','firecap','damageGraph[1].distance','damageGraph[*].distance','damageGraph[-1].distance','damageGraph[1].damage','penetrationdepth','suppression','multhead','multtorso','pelletcount','magsize','spread'];
  const hm = res.get('hideminimap'), hr = res.get('hiderange');
  let radar = '';
  if (hm && hm.set && hm.set.val === true) radar = `<div class="stat"><span class="l">레이더(미니맵)</span><span class="v good-t">${hr && hr.set ? E.fmtVal(hr.set.val + (hr.add || 0)) : '?'}스터드 밖 적에게 숨김</span><span class="s">소음 없이 쏘면 거리와 상관없이 모든 적 미니맵에 떠요</span></div>`;
  else if (res.get('hideflash')) radar = `<div class="stat"><span class="l">레이더(미니맵)</span><span class="v bad-t">숨기지 못함</span><span class="s">총구 화염만 숨겨져요</span></div>`;
  const balHTML = bal.map(k => statRow(res, k)).join('') + radar + statRow(res, 'pinglife', '레이더 표시 시간', '이 수치가 있는 총 46종에서만 작동');
  h += `<div class="panel"><h2>탄도와 레이더</h2>${balHTML || '<p class="cond">변화 없음</p>'}</div>`;

  const groups = {};
  for (const r of res.values()) (groups[r.d.cat] ||= []).push(r);
  let all = '';
  for (const c of CAT_ORDER) if (groups[c]) {
    all += `<h4>${c}</h4>` + groups[c].sort((a, b) => a.d.label.localeCompare(b.d.label)).map(r => {
      const v = E.verdict(r.d, r.d.prm === 4 ? Math.abs(r.factor) : r.factor);
      return `<details class="k"><summary><span>${esc(r.d.label)}${r.d.recoil && r.d.layer === 2 ? ' (2층)' : ''}</span><span class="${r.set ? '' : cls(v)} num" style="font-weight:700">${esc(E.valueText(r))}</span></summary>${formulaHTML(r)}</details>`;
    }).join('');
  }
  if (all) h += `<div class="panel"><details class="all"><summary>모든 항목과 계산 과정 (${res.size}개)</summary>${all}</details></div>`;
  $('#result').innerHTML = h;
}

/* ----- 계산 방식 ----- */
function renderRules() {
  const byCls = c => DATA.optics.filter(o => o.cls === c).sort((a, b) => (a.zoom || 0) - (b.zoom || 0)).map(o => `<span>${esc(o.name)} ${o.zoom ?? ''}${o.new ? ' (신규)' : ''}</span>`).join('');
  $('#rules').innerHTML = `
  <div class="panel"><h2>이 도감이 보여주는 것</h2>
    <p>총마다 기본 반동이 다르기 때문에, 여기서는 총 없이 파츠가 기본값에 곱하는 <b>배율</b>을 보여줘요. 예를 들어 "카메라 수직 −17%"는 어떤 총이든 그 총의 카메라 수직 반동이 0.83배가 된다는 뜻이에요.</p>
    <p>일부 총은 전용 설정으로 같은 파츠의 효과가 조금 다를 수 있어요. 탄약은 Super Armor Piercing(5.45mm 계열 14종)과 .223 Rem(5.56mm 계열 54종)만 넣었고, 기본값 기준이에요.</p></div>

  <div class="panel"><h2>반동의 네 종류</h2>
    <ul>
      <li><b>카메라 반동</b>: 화면과 총이 같이 튀어요. 탄착에 영향을 줘요.</li>
      <li><b>총 반동</b>: 화면 안에서 조준점만 튀어요. 탄착에 영향을 줘요.</li>
      <li><b>총 위치 밀림</b>: 총 모델만 뒤로 밀려요. 보이기만 해요.</li>
      <li><b>화면 흔들림</b>: 화면만 흔들려요. 보이기만 해요.</li>
    </ul>
    <p>각 반동은 <b>쏠림</b>(매 발 같은 방향으로 미는 힘, 손으로 당겨서 잡는 부분)과 <b>랜덤</b>(매 발 무작위로 정해지는 흔들림, 손으로 못 잡는 부분)으로 나뉘어요. 수직은 위아래, 좌우는 옆, 기울기는 총이 옆으로 기우는 반동이에요.</p>
    <p>반동이 2단으로 된 총도 있어요. 2층 효과는 그런 총에서만 작동해요. 공통 총 287종 중 2층이 있는 비율은 카메라 수직 64%, 카메라 좌우 29%, 총 수직 15%, 총 좌우 5%예요.</p></div>

  <div class="panel"><h2>여러 파츠를 같이 끼면</h2>
    <p>게임은 효과 종류마다 계산 방식이 달라요. 순서는 설정 → 더하기 → 합산 배율 → 곱하기예요.</p>
    <ul>
      <li><b>합산 배율</b>: 같은 항목의 +끼리, −끼리 따로 더한 뒤 나눠요. 그래서 줄이는 효과를 겹칠수록 효율이 떨어져요.</li>
      <li><b>곱하기</b>: 그대로 곱해요. 음수면 방향이 뒤집혀요.</li>
      <li><b>설정</b>: 원래 값을 덮어써요.</li>
      <li><b>더하기</b>: 원래 값에 더해요.</li>
    </ul>
    <div class="formula">합산 배율 = (1 + 늘리는 값의 합) ÷ (1 + 줄이는 값의 합)<br>예) −20% 두 개 → 1 ÷ (1 + 0.2 + 0.2) = ×0.71 (−29%, 곱셈이었다면 −36%)<br>예) +10%와 −10% → (1 + 0.1) ÷ (1 + 0.1) = ×1 (정확히 상쇄)</div>
    <p class="cond">파츠 카드의 "원래 값"이 −0.2인 합산 배율은 단독으로 끼면 −17%(÷1.2)예요. 카드에는 단독으로 꼈을 때의 실제 효과가 표시돼요.</p></div>

  <div class="panel"><h2>조건이 붙는 효과</h2>
    <ul>
      <li><b>반동 회복</b>: 사격을 0.1초 이상 멈췄을 때만 작동해요. 600RPM 이상으로 연사하는 중에는 작동하지 않아요.</li>
      <li><b>시점 돌릴 때 총 흔들림</b>: 이 수치가 있는 총 16종에서만 작동해요.</li>
      <li><b>레이더 표시 시간</b>: 이 수치가 있는 총 46종에서만 작동해요.</li>
      <li><b>스코프 흔들림</b>: 배율 스코프를 달았을 때만 작동해요.</li>
      <li><b>걷기·정지 출렁임</b>: 총 위치만 흔드는 값이라 보이기만 해요. 레드닷 점은 항상 탄이 나가는 방향을 가리켜요.</li>
    </ul></div>

  <div class="panel"><h2>조준경 흔들림 등급</h2>
    <p>조준경은 반동을 바꾸지 않지만, 조준 중 이동 흔들림이 남는 비율이 등급마다 달라요.</p>
    <h4>레드닷과 홀로 (40%)</h4><div class="optlist">${byCls('mid')}</div>
    <h4>아이언 사이트 (60%)</h4><div class="optlist">${byCls('none')}</div>
    <h4>배율 스코프 (20%, 대신 스코프 흔들림이 따로 있음)</h4><div class="optlist">${byCls('black')}</div>
    <p class="cond">SPEC. REFLEX와 ELFX는 신규 레드닷이라 레드닷 등급으로 추정했어요.</p></div>

  <div class="panel"><h2>레이더</h2>
    <p>소음 없이 쏘면 거리와 상관없이 모든 적의 미니맵에 떠요. 소음기나 플래시 하이더를 달면 정해진 거리 안에 있는 적에게만 떠요.</p></div>

  <div class="panel"><h2>데이터 기준</h2>
    <p>${esc(DATA.version)}. 숫자가 적힌 패치 변경은 그대로 반영했고, 숫자 없이 문구만 있는 변경은 "수치 추정" 또는 "수치 미공개"로 표시했어요. 패치노트가 비공식이라 일부 차이가 있을 수 있어요.</p></div>`;
  $('#foot').innerHTML = `${esc(DATA.version)} 기준. 공통 파츠 ${ITEMS.length}개 수록.`;
}
