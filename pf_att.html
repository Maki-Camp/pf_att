<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>팬텀 포스 공통 파츠 도감</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E4E8DF; --surface:#F4F6F0; --surface2:#EAEDE5; --ink:#1D2620; --muted:#5A675D; --line:#C6CDC0;
  --brass:#946620; --good:#16704F; --bad:#AE3626; --vis:#6B7882; --focus:#2C5F8E; --chip:#DDE2D6;
  --good-bg:rgba(22,112,79,.10); --bad-bg:rgba(174,54,38,.10); --brass-bg:rgba(148,102,32,.12);
  --display:"Black Han Sans","IBM Plex Sans KR",system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR",system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141814; --surface:#1C211C; --surface2:#232923; --ink:#E3E8DF; --muted:#9AA59B; --line:#343C33;
    --brass:#D6A55A; --good:#4CC393; --bad:#F27C68; --vis:#95A3AC; --focus:#86B5E2; --chip:#2A312A;
    --good-bg:rgba(76,195,147,.13); --bad-bg:rgba(242,124,104,.13); --brass-bg:rgba(214,165,90,.14);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141814; --surface:#1C211C; --surface2:#232923; --ink:#E3E8DF; --muted:#9AA59B; --line:#343C33;
  --brass:#D6A55A; --good:#4CC393; --bad:#F27C68; --vis:#95A3AC; --focus:#86B5E2; --chip:#2A312A;
  --good-bg:rgba(76,195,147,.13); --bad-bg:rgba(242,124,104,.13); --brass-bg:rgba(214,165,90,.14);
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
.num{font-variant-numeric:tabular-nums}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}

/* 머리 */
header.top{padding:28px 0 18px}
.brand{display:flex;gap:16px;align-items:center}
.brand svg{flex:none}
h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,6vw,44px);line-height:1.05;margin:0;letter-spacing:-.01em}
.lede{margin:8px 0 0;color:var(--muted);max-width:62ch}
.legend{margin-top:16px;display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px;color:var(--muted);align-items:center}
.legend span{display:inline-flex;gap:6px;align-items:center}
.sw{width:10px;height:10px;border-radius:2px;display:inline-block}

/* 탭 */
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto}
nav.tabs button{background:none;border:0;padding:12px 14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brass)}
main{padding:18px 0 64px}
section[hidden]{display:none}

/* 필터 */
.filters{display:grid;gap:10px;margin-bottom:16px}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.search select{padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);max-width:46%}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13.5px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .c{opacity:.65;margin-left:4px}
.count{font-size:13px;color:var(--muted)}

/* 파츠 목록 */
.list{display:grid;gap:10px}
@media (min-width:780px){.list{grid-template-columns:1fr 1fr}}
.part{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-content:start}
.part .g{grid-row:span 3;align-self:start}
.part h3{margin:0;font-size:16.5px;line-height:1.3;font-weight:700}
.meta{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
.badge{font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:5px;background:var(--brass-bg);color:var(--brass)}
.badge.unk{background:var(--bad-bg);color:var(--bad)}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tag{font-size:12.5px;padding:3px 8px;border-radius:6px;background:var(--surface2);border:1px solid var(--line);white-space:nowrap}
.tag.good{background:var(--good-bg);border-color:transparent;color:var(--good)}
.tag.bad{background:var(--bad-bg);border-color:transparent;color:var(--bad)}
.tag.flip{background:var(--brass-bg);border-color:transparent;color:var(--brass)}
.tag.l2{border-style:dashed}
.tag b{font-weight:700}
.more{grid-column:1/-1;margin-top:6px}
.more>button{background:none;border:0;padding:4px 0;color:var(--brass);font-weight:600;cursor:pointer}
.detail{grid-column:1/-1;margin-top:8px;border-top:1px solid var(--line);padding-top:10px}
.note{font-size:13px;background:var(--surface2);border-left:3px solid var(--brass);padding:8px 10px;border-radius:0 8px 8px 0;margin:0 0 10px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--muted);white-space:nowrap}
td.v{white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:600}
td.good{color:var(--good)} td.bad{color:var(--bad)} td.flip{color:var(--brass)}
tr.vis td{color:var(--vis)} tr.vis td.v{font-weight:500}
.cond{color:var(--muted);font-size:12px}
h4{margin:12px 0 4px;font-size:13.5px}
.empty{padding:28px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px}

/* 계산기 */
.calc{display:grid;gap:16px}
@media (min-width:920px){.calc{grid-template-columns:330px 1fr;align-items:start}.slots{position:sticky;top:calc(env(safe-area-inset-top,0px) + 60px)}}
.slots{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px}
.slots label{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
.slots select{padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);font-weight:500;color:var(--ink)}
.slots .row{display:flex;gap:8px;justify-content:space-between;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:9px;padding:8px 12px;cursor:pointer;font-weight:600}
.result{display:grid;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.panel h2{font-family:var(--display);font-weight:400;font-size:20px;margin:0 0 10px;letter-spacing:-.005em}
.hero{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.big{display:grid;gap:8px}
.big .k{font-size:13px;color:var(--muted)}
.big .x{font-family:var(--display);font-size:30px;line-height:1}
.big .x small{font-family:var(--body);font-size:14px;font-weight:600;margin-left:6px}
.good-t{color:var(--good)} .bad-t{color:var(--bad)} .flip-t{color:var(--brass)} .mut-t{color:var(--muted)}
.grid4 td,.grid4 th{text-align:center}
.grid4 td:first-child,.grid4 th:first-child{text-align:left}
.stat{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:8px 0;border-bottom:1px solid var(--line)}
.stat:last-child{border-bottom:0}
.stat .l{font-weight:600}
.stat .v{font-variant-numeric:tabular-nums;font-weight:700;text-align:right}
.stat .s{grid-column:1/-1;font-size:12px;color:var(--muted)}
details.all summary{cursor:pointer;font-weight:700;padding:4px 0}
details.k{border-bottom:1px solid var(--line);padding:6px 0}
details.k summary{cursor:pointer;display:flex;justify-content:space-between;gap:10px}
details.k summary::-webkit-details-marker{display:none}
details.k .f{font-size:12.5px;color:var(--muted);padding:6px 0 2px 10px;border-left:2px solid var(--line);margin-top:6px}
.f code{font-family:var(--body);font-weight:600;color:var(--ink)}

/* 계산 방식 */
.rules{display:grid;gap:14px;max-width:820px}
.rules p,.rules li{max-width:72ch}
.rules ul{padding-left:20px;margin:6px 0}
.formula{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-variant-numeric:tabular-nums}
.optlist{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.optlist span{font-size:12.5px;padding:2px 8px;border-radius:6px;background:var(--surface2);border:1px solid var(--line)}
footer{color:var(--muted);font-size:12.5px;padding:24px 0 40px;border-top:1px solid var(--line)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <span id="heroGlyph" aria-hidden="true"></span>
      <div>
        <h1>팬텀 포스 공통 파츠 도감</h1>
        <p class="lede">권총·리볼버를 뺀 총 237종에 달 수 있는 공통 파츠와 자주 쓰는 탄약 두 종의 실제 효과를 게임 계산 방식 그대로 보여줘요. 파츠를 골라 조합하면 최종 반동 배율도 계산돼요. 레이저는 언더배럴과 기타 칸에 하나씩 달 수 있어요.</p>
      </div>
    </div>
    <div class="legend">
      <span>십자선 길이 = 반동 크기 (점선 원이 기본)</span>
      <span><i class="sw" style="background:var(--good)"></i>줄어듦</span>
      <span><i class="sw" style="background:var(--bad)"></i>늘어남</span>
      <span><i class="sw" style="background:var(--brass)"></i>방향 반전 (점선)</span>
    </div>
  </div>
</header>

<nav class="tabs" aria-label="화면 전환">
  <div class="wrap" role="tablist">
    <button role="tab" id="t-parts" aria-controls="tab-parts" aria-selected="true">파츠 찾기</button>
    <button role="tab" id="t-calc" aria-controls="tab-calc" aria-selected="false">조합 계산</button>
    <button role="tab" id="t-rules" aria-controls="tab-rules" aria-selected="false">계산 방식</button>
  </div>
</nav>

<main class="wrap">
  <section id="tab-parts" role="tabpanel" aria-labelledby="t-parts">
    <div class="filters">
      <div class="search">
        <input id="q" type="search" placeholder="이름으로 찾기 (예: 버티컬, 소음기, 레이저)" aria-label="파츠 이름 검색">
        <select id="sort" aria-label="정렬">
          <option value="kills">해금 킬 적은 순</option>
          <option value="v">수직 반동 감소 큰 순</option>
          <option value="h">좌우 반동 감소 큰 순</option>
          <option value="name">이름 순</option>
        </select>
      </div>
      <div class="chips" id="slotChips" aria-label="슬롯"></div>
      <div class="chips" id="effChips" aria-label="효과 조건"></div>
      <div class="count" id="count" aria-live="polite"></div>
    </div>
    <div class="list" id="list"></div>
  </section>

  <section id="tab-calc" role="tabpanel" aria-labelledby="t-calc" hidden>
    <div class="calc">
      <div class="slots" id="slots"></div>
      <div class="result" id="result"></div>
    </div>
  </section>

  <section id="tab-rules" role="tabpanel" aria-labelledby="t-rules" hidden>
    <div class="rules" id="rules"></div>
  </section>
</main>

<footer>
  <div class="wrap" id="foot"></div>
</footer>

    swayamp: ['스코프 흔들림 크기', '스코프', 'low', 'scope'], swayspeed: ['스코프 흔들림 속도', '스코프', 'low', 'scope'],
    breathspeed: ['숨 참기 소모', '스코프', 'low', 'scope'], recoverspeed: ['숨 회복', '스코프', 'high', 'scope'],
    steadyspeed: ['숨 참기 안정 속도', '스코프', 'high', 'scope'],
    bulletspeed: ['탄속', '탄도', 'high'], firerate: ['연사 속도', '탄도', 'high', 'firerate'], firecap: ['단발 최대 속도', '탄도', 'high'],
    penetrationdepth: ['관통력', '탄도', 'high'], suppression: ['적 제압 효과', '탄도', 'high'],
    multhead: ['헤드 배율', '탄도', 'high'], multtorso: ['몸통 배율', '탄도', 'high'],
    pelletcount: ['산탄 수', '탄도', null], magsize: ['탄창', '탄도', 'high'], sparerounds: ['예비탄', '탄도', 'high'],
    spread: ['탄 퍼짐', '탄도', 'low'],
    hideminimap: ['레이더 숨김', '레이더', null], hiderange: ['레이더에 뜨는 거리', '레이더', 'low'],
    hideflash: ['총구 화염 숨김', '레이더', null], pinglife: ['레이더 표시 시간', '레이더', 'low', 'cond46'],
    hipfirespread: ['지향사격 퍼짐', '지향사격', 'low', 'hip'], hipfirespreadrecover: ['지향사격 퍼짐 회복', '지향사격', 'high', 'hip'],
    hipfirestability: ['지향사격 안정성', '지향사격', 'high', 'hip'], crosssize: ['크로스헤어 크기', '지향사격', null, 'crosssize'],
    crossexpansion: ['연사 시 크로스헤어 벌어짐', '지향사격', 'low', 'hip'],
  };

  // 데미지 그래프: 모든 총의 1번 지점은 0스터드라서 번호 의미가 고정돼요.
  function dg(idx, field) {
    if (field === 'damage') {
      if (idx === '1') return { label: '최대 데미지 (0스터드 지점)', better: 'high', eff: 'bullet' };
      if (idx === '2') return { label: '최대 데미지 (끝 지점)', better: 'high', eff: 'bullet' };
      if (idx === '-1') return { label: '최소 데미지', better: 'high', eff: 'bullet' };
      if (idx === '*') return { label: '데미지 (모든 지점)', better: 'high', eff: 'bullet' };
      return { label: `데미지 (${idx}번 지점)`, better: 'high', eff: idx === '3' ? 'dg3' : 'dgpt' };
    }
    if (idx === '1') return { label: '0스터드 지점 거리', better: null, eff: 'noop' };
    if (idx === '2') return { label: '최대 데미지 사거리', better: 'high', eff: 'bullet' };
    if (idx === '-1') return { label: '최소 데미지 시작 거리', better: 'high', eff: 'bullet' };
    if (idx === '*') return { label: '데미지 거리 (모든 지점)', better: 'high', eff: 'bullet' };
    return { label: `데미지 거리 (${idx}번 지점)`, better: 'high', eff: idx === '3' ? 'dg3' : 'dgpt' };
  }

  function describe(key) {
    if (key.startsWith('recoil.')) {
      const [, g, ax, layer, prm] = key.split('.');
      const G = GRP[g] || { n: g, eff: 'other', cat: '반동' };
      let eff = G.eff;
      if (ax === 'z' && eff === 'bullet') eff = 'roll';
      const better = (prm === '3' || prm === '4') ? 'low' : 'high';
      const label = `${G.n} ${AX[ax] || ax} ${PRM[prm] || prm}`;
      return { label, cat: G.cat, eff, better, layer: +layer, group: g, axis: ax, prm: +prm, recoil: true };
    }
    const m = key.match(/^damageGraph\[(.+?)\]\.(distance|damage)$/);
    if (m) return { ...dg(m[1], m[2]), cat: '탄도' };
    const k = K[key];
    if (k) return { label: k[0], cat: k[1], better: k[2], eff: k[3] || 'bullet' };
    return { label: key, cat: '기타', better: null, eff: 'other' };
  }

  const counts = () => (typeof DATA !== 'undefined' && DATA.baseCounts) || { aimswingmod: 16, pinglife: 44, total: 237 };
  const layers = () => (typeof DATA !== 'undefined' && DATA.layers) || {};

  function condNote(d) {
    if (d.recoil) {
      if (d.eff === 'visual') return '탄이 나가는 방향은 그대로예요. 총 모습이나 화면만 흔들려요';
      if (d.eff === 'recovery') return '마지막 사격 후 잠깐(대부분 0.1초) 쉬어야 작동';
      if (d.eff === 'roll') return '총이 옆으로 기우는 반동. 탄착 영향은 거의 없음';
      if (d.eff === 'hip') return '지향사격에만 적용';
      if (d.layer === 2) {
        const L = layers();
        const pct = { 'aimCameraBody.x': L.camV2, 'aimCameraBody.y': L.camH2, 'aimRotation.x': L.gunV2, 'aimRotation.y': L.gunH2 }[`${d.group}.${d.axis}`];
        return pct ? `반동이 2단으로 된 총에서만 작동 (공통 파츠 총의 약 ${pct}%)` : '반동이 2단으로 된 총에서만 작동';
      }
      return '';
    }
    switch (d.eff) {
      case 'visual': return '탄이 나가는 방향은 그대로예요. 총 모습만 흔들려요';
      case 'cond16': return `이 수치가 있는 총 ${counts().aimswingmod}종에서만 작동`;
      case 'cond46': return `이 수치가 있는 총 ${counts().pinglife}종에서만 작동`;
      case 'scope': return '배율 스코프를 달았을 때만 작동';
      case 'hip': return '지향사격에만 적용';
      case 'noop': return '그래프 첫 지점은 항상 0스터드라 곱해도 변화가 없어요';
      case 'dg3': return '지점이 3개인 총(대부분)에서는 최소 데미지 쪽 지점이에요';
      case 'dgpt': return '그래프 지점이 이만큼 있는 총에서만 작동';
      case 'firerate': return '발사 동작 애니메이션이 있는 총은 그 속도에 막힐 수 있어요';
      case 'crosssize': return '지향사격 퍼짐 계산에 쓰여요. 일부 저격총은 기본 탄 퍼짐도 같이 바뀌어요';
      default: return '';
    }
  }

  function factorOf(op, v) {
    if (op === 'rel') return v >= 0 ? 1 + v : 1 / (1 - v);
    if (op === 'mul') return v;
    return null;
  }

  // 조합 계산: 게임 규칙 그대로 (설정 → 더하기 → 합산 배율 → 곱하기)
  // 설정은 우선순위가 높은 쪽, 같으면 나중 칸(조준경→총구→언더배럴→기타→탄약)이 이겨요.
  function combine(items) {
    const acc = new Map();
    items.forEach(it => {
      for (const m of it.mods) {
        let a = acc.get(m.key);
        if (!a) { a = { key: m.key, set: null, add: 0, hasAdd: false, P: 0, N: 0, mul: 1, hasMul: false, hasRel: false, parts: [] }; acc.set(m.key, a); }
        a.parts.push({ name: it.slotLabel ? `${it.name} (${it.slotLabel})` : it.name, op: m.op, val: m.val });
        if (m.op === 'set') {
          const pri = m.pri || 0;
          if (!a.set || pri >= a.set.pri) a.set = { val: m.val, pri, from: it.name };
        } else if (m.op === 'add') { a.add += m.val; a.hasAdd = true; }
        else if (m.op === 'rel') { a.hasRel = true; if (m.val > 0) a.P += m.val; else a.N += -m.val; }
        else if (m.op === 'mul') { a.hasMul = true; a.mul *= m.val; }
      }
    });
    const out = new Map();
    for (const [k, a] of acc) {
      const rel = (1 + a.P) / (1 + a.N);
      out.set(k, { ...a, rel, factor: rel * a.mul, d: describe(k) });
    }
    return out;
  }

  function fmtPct(f) {
    const p = (f - 1) * 100;
    const r = Math.abs(p) < 0.05 ? 0 : p;
    const s = Math.abs(r) >= 10 ? Math.round(r) : Math.round(r * 10) / 10;
    return (s > 0 ? '+' : s < 0 ? '−' : '±') + Math.abs(s) + '%';
  }
  function fmtX(f) {
    const a = Math.abs(f);
    return '×' + (a >= 10 ? a.toFixed(1) : a.toFixed(2).replace(/0$/, '').replace(/\.$/, ''));
  }
  function verdict(d, f) {
    if (f === 1 || d.better == null) return 'neutral';
    if (d.recoil && d.prm === 4) f = Math.abs(f);
    if (f < 0) return 'flip';
    const up = f > 1;
    return (d.better === 'high') === up ? 'good' : 'bad';
  }
  function valueText(r) {
    const d = r.d;
    const f = r.factor;
    const isVar = d.recoil && d.prm === 4;
    if (r.set) {
      let s = `= ${fmtVal(r.set.val)}`;
      if (r.hasAdd) s = `= ${fmtVal(r.set.val + r.add)}`;
      if (r.hasRel || r.hasMul) s += ` ${fmtX(f)}`;
      return s;
    }
    let s = '';
    if (r.hasAdd) s += `+${fmtVal(r.add)} `;
    if (r.hasRel || r.hasMul) {
      if (f < 0 && !isVar) s += `방향 반전 ${fmtX(f)}`;
      else { const g = isVar ? Math.abs(f) : f; s += `${fmtPct(g)} (${fmtX(g)})`; }
    }
    return s.trim();
  }
  function fmtVal(v) {
    if (v === true) return '켜짐';
    if (v === false) return '꺼짐';
    if (typeof v === 'number') return Math.round(v * 1000) / 1000;
    return String(v);
  }

  // 직관 지수: 1층 카메라·총 반동 (쏠림·랜덤) 평균
  function recoilIndex(res, axis) {
    const ks = [`recoil.aimCameraBody.${axis}.1.3`, `recoil.aimCameraBody.${axis}.1.4`, `recoil.aimRotation.${axis}.1.3`, `recoil.aimRotation.${axis}.1.4`];
    let sum = 0, flip = false;
    for (const k of ks) {
      const r = res.get(k);
      let f = r ? r.factor : 1;
      if (f < 0) { if (k.endsWith('.3')) flip = true; f = -f; }
      sum += f;
    }
    return { v: sum / ks.length, flip };
  }
  function adsMove(res) {
    const w = res.get('walkspeed'), a = res.get('aimwalkspeedmult');
    const wf = w ? w.factor : 1;
    if (a && a.set) return { fixed: a.set.val * (a.hasRel || a.hasMul ? a.factor : 1), f: wf };
    const af = a ? a.factor : 1;
    return { f: wf * af };
  }

  return { describe, condNote, factorOf, combine, fmtPct, fmtX, verdict, valueText, fmtVal, recoilIndex, adsMove };
})();

/* ----- 십자선 그림 ----- */
function glyph(v, h, vflip, hflip, size = 56) {
  const L = 19, cl = x => Math.max(0.3, Math.min(1.9, x));
  const lv = L * cl(v), lh = L * cl(h), gap = 5;
  const col = x => x < 0.995 ? 'var(--good)' : x > 1.005 ? 'var(--bad)' : 'var(--muted)';
  const cv = vflip ? 'var(--brass)' : col(v), ch = hflip ? 'var(--brass)' : col(h);
  const dv = vflip ? ' stroke-dasharray="3 2.4"' : '', dh = hflip ? ' stroke-dasharray="3 2.4"' : '';
  return `<svg width="${size}" height="${size}" viewBox="-30 -30 60 60" role="img" aria-label="수직 ${E.fmtX(v)}${vflip?' 방향 반전':''}, 좌우 ${E.fmtX(h)}${hflip?' 방향 반전':''}">
    <circle r="${L}" fill="none" stroke="var(--line)" stroke-width="1.2" stroke-dasharray="2 2.5"/>
    <g stroke-linecap="round" stroke-width="3.2">
      <line x1="0" y1="${-gap}" x2="0" y2="${-lv}" stroke="${cv}"${dv}/>
      <line x1="0" y1="${gap}" x2="0" y2="${lv}" stroke="${cv}"${dv}/>
      <line x1="${-gap}" y1="0" x2="${-lh}" y2="0" stroke="${ch}"${dh}/>
      <line x1="${gap}" y1="0" x2="${lh}" y2="0" stroke="${ch}"${dh}/>
    </g>
    <circle r="1.8" fill="var(--ink)"/>
  </svg>`;
}

/* ----- 카드 요약 태그 ----- */
const RG = [['aimCameraBody','카메라'],['aimRotation','총']];
function recoilTags(res, layer) {
  const out = [];
  for (const [g, gn] of RG) for (const ax of ['x','y']) {
    const m = res.get(`recoil.${g}.${ax}.${layer}.3`), s = res.get(`recoil.${g}.${ax}.${layer}.4`);
    if (!m && !s) continue;
    const axn = ax === 'x' ? '수직' : '좌우';
    const pre = layer === 2 ? '2층 ' : '';
    const fm = m ? m.factor : 1, fs = s ? Math.abs(s.factor) : 1;
    if (fm < 0) {
      out.push({ t: `${pre}${gn} ${axn} 방향 반전 ${E.fmtX(fm)}`, k: 'flip', l2: layer === 2 });
      if (s && Math.abs(fs - 1) > 0.004) out.push({ t: `${pre}${gn} ${axn} 랜덤 ${E.fmtPct(fs)}`, k: fs < 1 ? 'good' : 'bad', l2: layer === 2 });
      continue;
    }
    if (m && s && Math.abs(fm - fs) < 0.006) { if (Math.abs(fm - 1) > 0.004) out.push({ t: `${pre}${gn} ${axn} ${E.fmtPct(fm)}`, k: fm < 1 ? 'good' : 'bad', l2: layer === 2 }); continue; }
    if (m && Math.abs(fm - 1) > 0.004) out.push({ t: `${pre}${gn} ${axn} 쏠림 ${E.fmtPct(fm)}`, k: fm < 1 ? 'good' : 'bad', l2: layer === 2 });
    if (s && Math.abs(fs - 1) > 0.004) out.push({ t: `${pre}${gn} ${axn} 랜덤 ${E.fmtPct(fs)}`, k: fs < 1 ? 'good' : 'bad', l2: layer === 2 });
  }
  return out;
}
function simpleTag(res, key, name, minAbs = 0.004) {
  const r = res.get(key); if (!r || r.set) return null;
  const f = r.factor; if (Math.abs(f - 1) <= minAbs) return null;

}
function rangeTags(res) {
  const r2 = res.get('damageGraph[2].distance'), rL = res.get('damageGraph[-1].distance') || res.get('damageGraph[3].distance');
  const f2 = r2 ? r2.factor : 1, fL = rL ? rL.factor : 1, T = [];

  else {
    if (Math.abs(f2 - 1) > 0.004) T.push({ t: `최대 데미지 사거리 ${E.fmtPct(f2)}`, k: kk(f2) });
    if (Math.abs(fL - 1) > 0.004) T.push({ t: `최소 데미지 거리 ${E.fmtPct(fL)}`, k: kk(fL) });
  }

}
function tagsFor(it) {
  const res = it.res, T = [];

    if (it.id !== 'Chainsaw Grip') T.push({ t: CLS_TAG[it.cls], k: it.cls === 'none' ? 'bad' : 'good' });
    const sa = res.get('swayamp');
    if (sa && sa.set && sa.set.val === 0) T.push({ t: '스코프 흔들림 없음', k: 'good' });
  }
  if (it.kind === 'ammo') T.push({ t: it.appliesTo, k: '' });
  T.push(...recoilTags(res, 1));
  const l2 = recoilTags(res, 2).filter(x => !T.some(y => y.t === x.t.replace('2층 ', '')));
  T.push(...l2);
  if (it.id === 'Chainsaw Grip') T.push({ t: '조준경 무시, 배율 0.9', k: 'bad' });
  if (it.ads.fixed != null) T.push({ t: `조준 중 이동 배율 ${E.fmtVal(it.ads.fixed)}로 고정`, k: '' });
  if (it.kind === 'ammo') [['damageGraph[1].damage','최대 데미지'],['damageGraph[-1].damage','최소 데미지'],['multtorso','몸통 배율'],['multhead','헤드 배율']]
    .forEach(([k, n]) => { const t = simpleTag(res, k, n); if (t) T.push(t); });
  else if (Math.abs(it.ads.f - 1) > 0.004 && it.ads.fixed == null) T.push({ t: `조준 중 이동 ${E.fmtPct(it.ads.f)}`, k: it.ads.f > 1 ? 'good' : 'bad' });
  [['aimspeed','조준 속도'],['sprintspeed','달리기 전환'],['equipspeed','꺼내기'],['walkswayrotaimmult','걷기 흔들림'],
   ['sway.posImpToAngImpMult','방향 전환 총 튐'],['sway.angImpToAngImpMult','마우스 휙 총 튐'],['aimswingmod','관성 흔들림'],
   ['bulletspeed','탄속'],['firerate','연사'],['penetrationdepth','관통력'],['swayamp','스코프 흔들림'],['crossexpansion','연사 시 크로스헤어 벌어짐']]
    .forEach(([k, n]) => { const t = simpleTag(res, k, n); if (t) T.push(t); });

  return T;
}

  else if (u && o && LASERS.has(u.id) && LASERS.has(o.id)) notes.push(`레이저 두 개(${esc(u.name)}, ${esc(o.name)})의 효과가 합산 배율 규칙으로 합쳐졌어요.`);
  const killList = chosen.filter(i => killsIn(i, i.slot) != null).map(i => `${SLOT_KO[i.slot]} ${esc(i.name)} ${killsIn(i, i.slot).toLocaleString()}킬`);
  let h = `<div class="panel"><div class="hero">${glyph(vi.v, hi.v, vi.flip, hi.flip, 96)}<div class="big">
    <div><div class="k">수직 반동 (카메라·총, 쏠림·랜덤 평균)</div><div class="x ${cls(vv)} num">${E.fmtX(vi.v)}<small>${vi.flip ? '방향 반전 포함' : E.fmtPct(vi.v)}</small></div></div>
    <div><div class="k">좌우 반동 (카메라·총, 쏠림·랜덤 평균)</div><div class="x ${cls(hv)} num">${E.fmtX(hi.v)}<small>${hi.flip ? '방향 반전 포함' : E.fmtPct(hi.v)}</small></div></div>
  </div></div>${notes.map(n => `<p class="note" style="margin-top:12px">${n}</p>`).join('')}
  ${killList.length ? `<p class="cond" style="margin:10px 0 0">해금 조건: ${killList.join(', ')}</p>` : ''}
  ${!chosen.length ? `<p class="cond" style="margin-top:10px">왼쪽에서 슬롯별로 파츠를 골라보세요. 총의 기본 반동에 아래 배율이 곱해져요.</p>` : ''}</div>`;

  h += `<div class="panel"><h2>탄착에 영향 주는 반동</h2><div class="scroll"><table class="grid4"><thead><tr><th></th><th>쏠림</th><th>랜덤</th><th>2층 쏠림</th><th>2층 랜덤</th></tr></thead><tbody>`;
  for (const [g, gn] of RG) for (const ax of ['x','y']) {
    h += `<tr><td><b>${gn} ${ax === 'x' ? '수직' : '좌우'}</b></td>${[`recoil.${g}.${ax}.1.3`,`recoil.${g}.${ax}.1.4`,`recoil.${g}.${ax}.2.3`,`recoil.${g}.${ax}.2.4`].map(k => cellFor(res, k)).join('')}</tr>`;
  }
  h += `</tbody></table></div><p class="cond" style="margin:8px 0 0">쏠림은 매 발 같은 방향으로 미는 힘(손으로 잡는 부분)이고, 랜덤은 쏠림 값을 중심으로 매 발 무작위로 더해지는 폭(손으로 못 잡는 부분)이에요. 2층은 반동이 2단으로 된 총에서만 작동해요. 컨트롤러는 카메라 반동이 ×0.5, 터치는 ×0.75로 줄어서 그만큼 총 반동 비중이 커져요.</p></div>`;

  let adsTxt = '', adsCls = '';
  if (ads.fixed != null) { adsTxt = `배율 ${E.fmtVal(ads.fixed)} 고정${Math.abs(ads.f - 1) > 0.004 ? `, 기본 이동 ${E.fmtPct(ads.f)}` : ''}`; adsCls = ''; }
  else if (Math.abs(ads.f - 1) > 0.0005) { adsTxt = `${E.fmtPct(ads.f)} (${E.fmtX(ads.f)})`; adsCls = ads.f > 1 ? 'good-t' : 'bad-t'; }
  const handleKeys = ['aimspeed','magnifyspeed','sprintspeed','equipspeed','walkswayrotaimmult','sway.posImpToAngImpMult','sway.angImpToAngImpMult','aimswingmod','swayamp'];
  h += `<div class="panel"><h2>조작과 흔들림</h2>
    ${adsTxt ? `<div class="stat"><span class="l">조준 중 이동 속도</span><span class="v ${adsCls}">${esc(adsTxt)}</span><span class="s">${ads.fixed != null ? '총 원래 배율과 상관없이 고정돼요. 원래 0.5보다 낮던 총은 오히려 빨라져요' : '기본 이동 속도와 조준 중 이동 배율을 합친 값'}</span></div>` : ''}
    ${statRow(res,'aimspeed','조준 속도')}${statRow(res,'magnifyspeed','배율 전환 속도')}${statRow(res,'sprintspeed','달리다 쏘기 전환')}${statRow(res,'equipspeed','꺼내기 속도')}
    ${statRow(res,'walkswayrotaimmult','조준 중 걷기 흔들림','탄착에 영향을 주는 회전 흔들림')}${statRow(res,'sway.posImpToAngImpMult','이동 방향 바꿀 때 총 튐')}${statRow(res,'sway.angImpToAngImpMult','마우스 휙 돌릴 때 총 튐')}
    ${statRow(res,'aimswingmod','관성 흔들림 (총 전용 배율)')}${statRow(res,'swayamp','스코프 흔들림 크기')}
    ${!handleKeys.some(k => res.has(k)) && !adsTxt ? '<p class="cond">변화 없음</p>' : ''}</div>`;

  const bal = ['bulletspeed','firerate','firecap','damageGraph[1].damage','damageGraph[2].damage','damageGraph[-1].damage','damageGraph[2].distance','damageGraph[3].distance','damageGraph[-1].distance','damageGraph[*].distance','penetrationdepth','suppression','multhead','multtorso','pelletcount','magsize','spread'];
  const hm = res.get('hideminimap'), hr = res.get('hiderange');
  let radar = '';
  if (hm && hm.set && hm.set.val === true) radar = `<div class="stat"><span class="l">레이더(미니맵)</span><span class="v good-t">${hr && hr.set ? E.fmtVal(hr.set.val + (hr.add || 0)) : '?'}스터드 밖 적에게 숨김</span><span class="s">소음 없이 쏘면 거리와 상관없이 모든 적 미니맵에 떠요</span></div>`;
  else if (res.get('hideflash')) radar = `<div class="stat"><span class="l">레이더(미니맵)</span><span class="v bad-t">숨기지 못함</span><span class="s">총구 화염만 숨겨져요</span></div>`;
  const balHTML = bal.map(k => statRow(res, k)).join('') + radar + statRow(res, 'pinglife', '레이더 표시 시간');
  h += `<div class="panel"><h2>탄도와 레이더</h2>${balHTML || '<p class="cond">변화 없음</p>'}</div>`;

  const groups = {};
  for (const r of res.values()) (groups[r.d.cat] ||= []).push(r);
  let all = '';
  for (const c of CAT_ORDER) if (groups[c]) {
    all += `<h4>${c}</h4>` + groups[c].sort((a, b) => a.d.label.localeCompare(b.d.label)).map(r => {
      const v = E.verdict(r.d, r.d.prm === 4 ? Math.abs(r.factor) : r.factor);
      return `<details class="k"><summary><span>${esc(r.d.label)}${r.d.recoil && r.d.layer === 2 ? ' (2층)' : ''}</span><span class="${r.set ? '' : cls(v)} num" style="font-weight:700">${esc(E.valueText(r))}</span></summary>${formulaHTML(r)}</details>`;
    }).join('');
  }
  if (all) h += `<div class="panel"><details class="all"><summary>모든 항목과 계산 과정 (${res.size}개)</summary>${all}</details></div>`;
  $('#result').innerHTML = h;
}

/* ----- 계산 방식 ----- */
function renderRules() {
  const byCls = c => DATA.optics.filter(o => o.cls === c).sort((a, b) => (a.zoom || 0) - (b.zoom || 0))
    .map(o => `<span>${esc(o.name)} ${o.zoom ?? ''}${o.new ? ' (신규)' : ''}${o.old ? ` (옛 ${esc(o.old)})` : ''}</span>`).join('');
  const L = DATA.layers, C = DATA.baseCounts;
  const lz = ITEMS.filter(i => LASERS.has(i.id));
  const laserRows = lz.map(i => `<tr><td>${esc(i.name)}</td><td class="num">${killsIn(i,'Underbarrel').toLocaleString()}</td><td class="num">${killsIn(i,'Other').toLocaleString()}</td></tr>`).join('');
  $('#rules').innerHTML = `
  <div class="panel"><h2>이 도감이 보여주는 것</h2>
    <p>총마다 기본 반동이 다르기 때문에, 여기서는 총 없이 파츠가 기본값에 곱하는 <b>배율</b>을 보여줘요. 예를 들어 "카메라 수직 −17%"는 어떤 총이든 그 총의 카메라 수직 반동이 0.83배가 된다는 뜻이에요.</p>
    <p>공통 파츠는 전체 총 ${C.allGuns}종 중 권총·리볼버 등 ${C.allGuns - C.total}종을 뺀 <b>${C.total}종</b>에 붙는 장착 목록이에요. 그래도 총마다 빠지는 파츠가 있어요. 예를 들어 머플러와 오일 필터는 ${C.total}종 중 49종에서 쓸 수 없어요. 파츠 카드의 "정확한 수치 보기"에서 쓸 수 있는 총 수를 확인할 수 있어요.</p>
    <p>일부 총은 전용 설정으로 효과가 달라요. 다만 성능까지 바뀌는 경우는 드물어요. 그립은 I MP-9 한 종뿐이고, SAP는 14종 중 9종이에요. 탄약은 Super Armor Piercing과 .223 Rem만 넣었고, 기본값 기준이에요.</p></div>

  <div class="panel"><h2>반동의 네 종류</h2>
    <ul>
      <li><b>카메라 반동</b>: 화면과 총이 같이 튀어요. 탄착에 영향을 줘요.</li>
      <li><b>총 반동</b>: 화면 안에서 총(조준점)만 돌아가요. 탄착에 영향을 줘요.</li>
      <li><b>총 위치 밀림</b>: 총 모델만 평행 이동해요. 탄 방향은 그대로예요.</li>
      <li><b>화면 흔들림</b>: 화면만 흔들려요. 탄 방향은 그대로예요.</li>
    </ul>
    <p>각 반동은 <b>쏠림</b>과 <b>랜덤</b>으로 나뉘어요. 매 발 충격은 "쏠림 ± 랜덤" 범위에서 무작위로 정해져요. 쏠림은 손으로 당겨서 잡는 부분이고, 랜덤은 손으로 못 잡는 부분이에요. 수직은 위아래, 좌우는 옆, 기울기는 총이 옆으로 기우는 반동이에요.</p>
    <p>반동이 2단으로 된 총도 있어요. 2층 효과는 그런 총에서만 작동해요. 공통 파츠 총 ${C.total}종 중 2층이 있는 비율은 카메라 수직 ${L.camV2}%, 카메라 좌우 ${L.camH2}%, 총 수직 ${L.gunV2}%, 총 좌우 ${L.gunH2}%예요.</p>
    <p>입력 장치에 따라 카메라 반동이 줄어요. 컨트롤러는 ×0.5, 터치는 ×0.75예요. 총 반동은 그대로라서, 패드에서는 총 반동을 줄이는 파츠의 비중이 커져요.</p></div>

  <div class="panel"><h2>탄착에 영향 주는 것과 아닌 것</h2>
    <p>탄은 화면 중앙이 아니라 <b>총이 실제로 향한 방향</b>으로 나가요. 조준 중에는 조준경, 지향사격 중에는 총구 방향이에요.</p>
    <ul>
      <li><b>총이 돌아가는 흔들림</b>은 탄착에 영향을 줘요. 총 반동, 걷기 흔들림의 회전, 관성 흔들림의 회전, 지향사격 퍼짐, 카메라 반동, 스코프 흔들림이 여기에 들어가요. 거리가 멀수록 오차가 커져요.</li>
      <li><b>총이 평행 이동하는 흔들림</b>은 탄 출발점만 조금 옮겨요. 총 위치 밀림, 정지 출렁임, 걷기 출렁임이 여기에 들어가요. 오차가 거리와 상관없이 그 크기 그대로라 사실상 영향이 없어요.</li>
      <li><b>화면만 흔들리는 효과</b>는 탄 방향 계산에 들어가지 않아요. 화면 흔들림, 제압 흔들림, 피격 흔들림이 여기에 들어가요.</li>
    </ul>
    <p>다만 화면 흔들림은 간접적으로 영향을 줘요. 조준 중에는 조준점이 총에 붙어 있어서 화면 중앙에서 밀려나 보여도 실제 탄 방향을 따라가요. 지향사격 크로스헤어는 화면 중앙에 고정이라, 화면이 흔들리거나 총이 돌아가면 실제 탄착과 어긋나요. 흔들리는 화면을 보고 마우스로 보정하면 그 보정은 진짜로 총 방향을 바꿔요.</p></div>

  <div class="panel"><h2>여러 파츠를 같이 끼면</h2>
    <p>게임은 효과 종류마다 계산 방식이 달라요. 순서는 설정 → 더하기 → 합산 배율 → 곱하기예요.</p>
    <ul>
      <li><b>합산 배율</b>: 같은 항목의 +끼리, −끼리 따로 더한 뒤 나눠요. 그래서 줄이는 효과를 겹칠수록 효율이 떨어져요.</li>
      <li><b>곱하기</b>: 그대로 곱해요. 음수면 방향이 뒤집혀요.</li>
      <li><b>설정</b>: 원래 값을 덮어써요. 우선순위가 높은 쪽이 이기고, 같으면 나중 칸(조준경 → 총구 → 언더배럴 → 기타 → 탄약)이 이겨요. 기본 파츠는 0, 총 전용 설정은 1, 체인소 그립은 2예요.</li>
      <li><b>더하기</b>: 원래 값에 더해요.</li>
    </ul>
    <div class="formula">합산 배율 = (1 + 늘리는 값의 합) ÷ (1 + 줄이는 값의 합)<br>예) −20% 두 개 → 1 ÷ (1 + 0.2 + 0.2) = ×0.71 (−29%, 곱셈이었다면 −36%)<br>예) +10%와 −10% → (1 + 0.1) ÷ (1 + 0.1) = ×1 (정확히 상쇄)</div>
    <p class="cond">파츠 카드의 "원래 값"이 −0.2인 합산 배율은 단독으로 끼면 −17%(÷1.2)예요. 카드에는 단독으로 꼈을 때의 실제 효과가 표시돼요.</p></div>

  <div class="panel"><h2>레이저 두 개 달기</h2>
    <p>레이저와 라이트는 언더배럴과 기타 칸에 하나씩 달 수 있어요. 게임 코드에는 같은 레이저를 두 칸에 다는 것을 막는 규칙이 없어서, 같은 레이저를 두 번 달아도 돼요. 그러면 효과가 합산 배율 규칙으로 한 번 더 들어가요.</p>
    <div class="formula">예) 그린 레이저의 관성 흔들림 −0.25<br>한 개: 1 ÷ 1.25 = ×0.8 (−20%)<br>두 개: 1 ÷ (1 + 0.25 + 0.25) = ×0.67 (−33%)</div>
    <p>해금 킬은 칸마다 달라요. 언더배럴 칸이 더 비싸요.</p>
    <div class="scroll"><table><thead><tr><th>파츠</th><th>언더배럴 칸</th><th>기타 칸</th></tr></thead><tbody>${laserRows}</tbody></table></div>
    <p class="cond">몇몇 총은 칸별 해금 킬이나 효과를 따로 정해 둬요. 표는 대부분의 총에 적용되는 값이에요.</p></div>

  <div class="panel"><h2>데미지 그래프 읽는 법</h2>
    <p>모든 총의 데미지 그래프는 0스터드 지점에서 시작해요. 지점이 3개인 총(대부분)은 0스터드, 최대 데미지 끝 지점, 최소 데미지 시작 지점으로 되어 있어요.</p>
    <ul>
      <li>0스터드 지점의 거리를 곱하는 효과는 아무 변화가 없어요.</li>
      <li>.223 Rem의 사거리 −25%는 최대 데미지 사거리에만 걸리고, 최소 데미지 시작 거리는 그대로예요.</li>
      <li>SAP의 데미지 −10%는 최대 데미지 구간에만 걸리고, 최소 데미지는 그대로예요.</li>
    </ul></div>

  <div class="panel"><h2>조건이 붙는 효과</h2>
    <ul>
      <li><b>반동 회복</b>: 마지막 사격 후 잠깐 쉬어야 작동해요. 대부분의 총은 0.1초라 600RPM 넘게 연사하는 중에는 작동하지 않아요. 일부 총은 0.03~0.4초로 달라요.</li>
      <li><b>관성 흔들림 (총 전용 배율)</b>: 이 수치가 있는 총 ${C.aimswingmod}종에서만 작동해요.</li>
      <li><b>레이더 표시 시간</b>: 이 수치가 있는 총 ${C.pinglife}종에서만 작동해요.</li>
      <li><b>스코프 흔들림</b>: 배율 스코프를 달았을 때만 작동해요. FF 3x NV는 흔들림이 0이라 그립 효과가 의미 없어요.</li>
      <li><b>연사 속도</b>: 펌프·볼트처럼 발사 동작 애니메이션이 있는 총은 애니메이션 속도가 상한이라, 연사 증가가 막힐 수 있어요.</li>
    </ul></div>

  <div class="panel"><h2>조준경 흔들림 등급</h2>
    <p>조준경은 반동을 바꾸지 않지만, 조준 중 <b>관성 흔들림</b>이 남는 비율이 등급마다 달라요. 관성 흔들림은 이동하거나 시점을 돌릴 때 총이 몸보다 늦게 따라오며 생기는 흔들림이에요. 회전 성분은 탄착에 영향을 주고, 위치 성분은 보이기만 해요. 걷기 흔들림과는 다른 값이에요.</p>
    <h4>레드닷과 홀로 (회전 40%, 위치 20%)</h4><div class="optlist">${byCls('mid')}</div>
    <h4>아이언 사이트 (회전 60%, 위치 30%)</h4><div class="optlist">${byCls('none')}</div>
    <h4>배율 스코프 (회전 20%, 위치 10%, 대신 스코프 흔들림이 따로 있음)</h4><div class="optlist">${byCls('black')}</div>
    <p class="cond">SPEC. REFLEX와 ELFX는 신규 레드닷이라 레드닷 등급으로 추정했어요. 11.17 신규 아이언 사이트는 패치노트만으로는 공통 파츠인지 알 수 없어요. 이름이 바뀐 사이트는 11.16 배율을 그대로 적었어요.</p></div>

  <div class="panel"><h2>레이더</h2>
    <p>소음 없이 쏘면 거리와 상관없이 모든 적의 미니맵에 떠요. 소음기나 플래시 하이더를 달면 정해진 거리 안에 있는 적에게만 떠요. 거리는 쏜 위치와 적의 시점 사이 거리예요.</p></div>

  <div class="panel"><h2>데이터 기준</h2>
    <p>${esc(DATA.version)}. 11.16 게임 모듈의 파츠 수치를 그대로 옮겼고, 11.17은 패치노트로 반영했어요. 숫자가 적힌 패치 변경은 그대로 넣었고, 숫자 없이 문구만 있거나 어느 항목에 해당하는지 불분명한 변경은 "수치 추정" 또는 "수치 미공개"로 표시했어요. 패치노트가 비공식이라 일부 차이가 있을 수 있어요.</p></div>`;
  $('#foot').innerHTML = `${esc(DATA.version)} 기준. 공통 파츠 ${ITEMS.length}개 수록. 공통 파츠는 총 ${C.total}종에 붙어요.`;
}

/* ----- 탭 ----- */
const TABS = ['parts','calc','rules'];
document.querySelector('nav.tabs').addEventListener('click', e => {
  const b = e.target.closest('[role="tab"]'); if (!b) return;
  const id = b.id.slice(2);
  TABS.forEach(t => { $('#t-' + t).setAttribute('aria-selected', t === id); $('#tab-' + t).hidden = t !== id; });
});

$('#heroGlyph').innerHTML = glyph(0.75, 1.15, false, false, 64);
renderChips(); renderList(); renderSlots(); renderResult(); renderRules();
})();
</script>
